<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#5b0e2d" />
<title>Vendas & Estoque</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>" />
<style>
  :root{
    --wine:#5b0e2d; --wine2:#7d1538; --gold:#c9a227; --bg:#faf7f5;
    --card:#ffffff; --ink:#26161c; --muted:#8a7780; --line:#ece4e7;
    --green:#1e7d5a; --green-bg:#e6f4ee; --red:#b3261e; --red-bg:#fbe9e7;
    --shadow:0 1px 3px rgba(50,10,25,.08),0 8px 24px rgba(50,10,25,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:84px;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- Header / dashboard ---------- */
  header{
    background:linear-gradient(135deg,var(--wine),var(--wine2));
    color:#fff; padding:14px 16px 18px; position:sticky; top:0; z-index:20;
    box-shadow:0 4px 18px rgba(50,10,25,.18);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;opacity:.95;margin-bottom:12px}
  .brand .dot{margin-left:auto;font-size:11px;font-weight:600;opacity:.85;display:flex;align-items:center;gap:5px}
  .dot .led{width:8px;height:8px;border-radius:50%;background:#9be6bf;box-shadow:0 0 0 0 rgba(155,230,191,.6);animation:pulse 2s infinite}
  .dot.off .led{background:#e6a39b;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(155,230,191,.6)}70%{box-shadow:0 0 0 7px rgba(155,230,191,0)}100%{box-shadow:0 0 0 0 rgba(155,230,191,0)}}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
  .stat .lbl{font-size:11px;opacity:.85;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
  .stat .val{font-size:20px;font-weight:800;margin-top:3px;line-height:1.1}
  .stat.money .val{color:#ffe9a8}
  .period{display:flex;gap:6px;margin-top:12px;background:rgba(0,0,0,.14);border-radius:10px;padding:3px}
  .period button{flex:1;border:0;background:transparent;color:#fff;opacity:.7;font-weight:700;font-size:13px;padding:7px;border-radius:8px}
  .period button.on{background:#fff;color:var(--wine);opacity:1}
  /* ---------- Layout ---------- */
  main{max-width:760px;margin:0 auto;padding:16px}
  .view{display:none}
  .view.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 2px 12px;font-weight:700}
  /* ---------- Product cards (vender) ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .pcard .pname{font-weight:800;font-size:16px;line-height:1.2}
  .pcard .pprice{color:var(--wine);font-weight:800;font-size:15px}
  .pcard .pstock{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800}
  .badge.ok{background:var(--green-bg);color:var(--green)}
  .badge.low{background:#fff4e0;color:#a8730a}
  .badge.zero{background:var(--red-bg);color:var(--red)}
  .sellbtn{margin-top:auto;border:0;border-radius:14px;background:linear-gradient(135deg,var(--green),#1aa06f);color:#fff;font-weight:800;font-size:16px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(30,125,90,.28);transition:transform .06s}
  .sellbtn:active{transform:scale(.96)}
  .sellbtn[disabled]{background:#e9e2e5;color:#b6a8ae;box-shadow:none}
  .qtyrow{display:flex;align-items:center;gap:8px;justify-content:center}
  .qtyrow button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:var(--wine)}
  .qtyrow button:active{background:var(--bg)}
  .qtyrow .q{min-width:34px;text-align:center;font-weight:800;font-size:18px}
  /* ---------- Estoque manage ---------- */
  .irow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .irow .info{flex:1;min-width:0}
  .irow .info .n{font-weight:800;font-size:16px}
  .irow .info .m{font-size:13px;color:var(--muted);margin-top:2px}
  .icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
  .icon-btn:active{background:var(--bg)}
  /* ---------- Historico ---------- */
  .hrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .hrow .ht{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hrow .hn{font-weight:700}
  .hrow .hv{margin-left:auto;font-weight:800;color:var(--green)}
  .undo{border:0;background:transparent;color:var(--red);font-weight:700;font-size:12px;padding:6px 8px;border-radius:8px}
  .undo:active{background:var(--red-bg)}
  /* ---------- Empty ---------- */
  .empty{text-align:center;color:var(--muted);padding:48px 20px}
  .empty .e{font-size:46px;margin-bottom:10px}
  .empty button{margin-top:14px}
  /* ---------- Buttons ---------- */
  .btn{border:0;border-radius:13px;padding:13px 18px;font-weight:800;font-size:15px}
  .btn.primary{background:var(--wine);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--wine)}
  .btn.block{width:100%}
  .btn:active{filter:brightness(.96)}
  /* ---------- Tabbar ---------- */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;border:0;background:transparent;padding:9px 0 8px;color:var(--muted);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabs button .ic{font-size:21px}
  nav.tabs button.on{color:var(--wine)}
  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(30,8,18,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .scrim.on{display:flex;animation:fade .15s}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.2);animation:up .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{margin:0 0 16px;font-size:19px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px;font-weight:600;color:var(--ink);background:#fff}
  .field input:focus{outline:none;border-color:var(--wine)}
  .sheet .actions{display:flex;gap:10px;margin-top:8px}
  .sheet .actions .btn{flex:1}
  .danger-link{color:var(--red);background:none;border:0;font-weight:700;font-size:14px;margin-top:14px;width:100%;padding:10px}
  /* ---------- Toast ---------- */
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--red)}
  #toast.ok{background:var(--green)}
</style>
</head>
<body>
<header>
  <div class="brand">🍷 Vendas &amp; Estoque <span class="dot" id="conn"><span class="led"></span><span id="connTxt">conectando…</span></span></div>
  <div class="stats">
    <div class="stat money"><div class="lbl">Arrecadado</div><div class="val" id="stMoney">R$ 0</div></div>
    <div class="stat"><div class="lbl">Vendidos</div><div class="val" id="stQty">0</div></div>
    <div class="stat"><div class="lbl">Em estoque</div><div class="val" id="stStock">0</div></div>
  </div>
  <div class="period">
    <button data-per="hoje" class="on">Hoje</button>
    <button data-per="tudo">Tudo</button>
  </div>
</header>

<main>
  <!-- VENDER -->
  <section class="view on" id="v-vender">
    <h2 class="sec">Toque para vender</h2>
    <div class="grid" id="sellGrid"></div>
  </section>

  <!-- ESTOQUE -->
  <section class="view" id="v-estoque">
    <button class="btn primary block" style="margin-bottom:16px" onclick="openProduct()">＋ Novo produto</button>
    <h2 class="sec">Produtos</h2>
    <div id="stockList"></div>
  </section>

  <!-- HISTORICO -->
  <section class="view" id="v-hist">
    <h2 class="sec" id="histTitle">Vendas de hoje</h2>
    <div id="histList"></div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="vender" class="on"><span class="ic">🛒</span>Vender</button>
  <button data-tab="estoque"><span class="ic">📦</span>Estoque</button>
  <button data-tab="hist"><span class="ic">📊</span>Histórico</button>
</nav>

<!-- Modal produto -->
<div class="scrim" id="scrim" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <h3 id="sheetTitle">Novo produto</h3>
    <input type="hidden" id="pid" />
    <div class="field">
      <label>Nome</label>
      <input id="f_nome" placeholder="Ex: Água 500ml" autocomplete="off" />
    </div>
    <div class="field">
      <label>Preço de venda (R$)</label>
      <input id="f_preco" inputmode="decimal" placeholder="0,00" />
    </div>
    <div class="field" id="estoqueField">
      <label id="estoqueLbl">Quantidade em estoque</label>
      <input id="f_estoque" inputmode="numeric" placeholder="0" />
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="closeSheet()">Cancelar</button>
      <button class="btn primary" onclick="saveProduct()">Salvar</button>
    </div>
    <button class="danger-link" id="delBtn" style="display:none" onclick="deleteProduct()">Excluir produto</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL  = 'https://qclgrrcyyiozqmmmelau.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjbGdycmN5eWlvenFtbW1lbGF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NTk1NTcsImV4cCI6MjA5NjEzNTU1N30.XwG1MCMLtmgPC79iirz4byHFMbHxwvIGNpv8rvy7fiY'
const sb = createClient(SUPABASE_URL, SUPABASE_ANON)

// ---------- estado ----------
let produtos = []
let vendas = []
let periodo = 'hoje'   // hoje | tudo
const qtySel = {}      // produto_id -> qtd escolhida no card

const $ = s => document.querySelector(s)
const BRL = n => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})
const BRLshort = n => { n=Number(n)||0; return n>=1000 ? 'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k' : BRL(n) }
const startOfToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d.toISOString() }

function toast(msg, kind=''){
  const t=$('#toast'); t.textContent=msg; t.className='show '+kind
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',1800)
}

// ---------- carregar ----------
async function loadProdutos(){
  const { data, error } = await sb.from('produtos').select('*').eq('ativo',true).order('ordem').order('created_at')
  if(error){ toast('Erro ao carregar produtos','err'); console.error(error); return }
  produtos = data||[]; renderSell(); renderStock(); renderStats()
}
async function loadVendas(){
  let q = sb.from('vendas').select('*').order('created_at',{ascending:false}).limit(500)
  if(periodo==='hoje') q = q.gte('created_at', startOfToday())
  const { data, error } = await q
  if(error){ console.error(error); return }
  vendas = data||[]; renderStats(); renderHist()
}

// ---------- render: stats ----------
function renderStats(){
  const arr = vendas.reduce((s,v)=>s+Number(v.total),0)
  const qt  = vendas.reduce((s,v)=>s+Number(v.qtd),0)
  const est = produtos.reduce((s,p)=>s+Number(p.estoque),0)
  $('#stMoney').textContent = BRLshort(arr)
  $('#stQty').textContent = qt
  $('#stStock').textContent = est
}

// ---------- render: vender ----------
function stockBadge(p){
  if(p.estoque<=0) return '<span class="badge zero">Esgotado</span>'
  if(p.estoque<=5) return `<span class="badge low">${p.estoque} restam</span>`
  return `<span class="badge ok">${p.estoque} em estoque</span>`
}
function renderSell(){
  const g=$('#sellGrid')
  if(!produtos.length){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="e">🍷</div>Nenhum produto ainda.<br>Cadastre na aba <b>Estoque</b>.<br><button class="btn primary" onclick="window.__tab('estoque')">Cadastrar produto</button></div>`
    return
  }
  g.innerHTML = produtos.map(p=>{
    const q = qtySel[p.id]||1
    const out = p.estoque<=0
    return `<div class="pcard">
      <div>
        <div class="pname">${esc(p.nome)}</div>
        <div class="pprice">${BRL(p.preco)}</div>
      </div>
      <div class="pstock">${stockBadge(p)}</div>
      <div class="qtyrow">
        <button onclick="window.__q('${p.id}',-1)" ${q<=1?'disabled style=opacity:.4':''}>−</button>
        <span class="q" id="q-${p.id}">${q}</span>
        <button onclick="window.__q('${p.id}',1)" ${q>=p.estoque?'disabled style=opacity:.4':''}>＋</button>
      </div>
      <button class="sellbtn" ${out?'disabled':''} onclick="window.__sell('${p.id}')">
        ${out?'Esgotado':`Vender ${q>1?'×'+q:''}`}
      </button>
    </div>`
  }).join('')
}
window.__q = (id,d)=>{
  const p = produtos.find(x=>x.id===id); if(!p) return
  let q=(qtySel[id]||1)+d; q=Math.max(1,Math.min(q,p.estoque||1)); qtySel[id]=q; renderSell()
}
window.__sell = async (id)=>{
  const p = produtos.find(x=>x.id===id); if(!p||p.estoque<=0) return
  const q = qtySel[id]||1
  // otimista
  p.estoque -= q; renderSell(); renderStats()
  if(navigator.vibrate) navigator.vibrate(18)
  const { error } = await sb.rpc('vender',{ p_produto_id:id, p_qtd:q })
  if(error){
    p.estoque += q; renderSell(); renderStats()
    toast(error.message||'Falha na venda','err')
  } else {
    toast(`Vendido: ${p.nome}${q>1?' ×'+q:''} • ${BRL(p.preco*q)}`,'ok')
    qtySel[id]=1
    loadVendas()
  }
}

// ---------- render: estoque ----------
function renderStock(){
  const l=$('#stockList')
  if(!produtos.length){ l.innerHTML=`<div class="empty"><div class="e">📦</div>Nenhum produto cadastrado.</div>`; return }
  l.innerHTML = produtos.map(p=>`
    <div class="irow">
      <div class="info">
        <div class="n">${esc(p.nome)}</div>
        <div class="m">${BRL(p.preco)} · ${stockBadge(p)}</div>
      </div>
      <button class="icon-btn" title="Repor" onclick="window.__restock('${p.id}')">➕</button>
      <button class="icon-btn" title="Editar" onclick="window.__edit('${p.id}')">✏️</button>
    </div>`).join('')
}
window.__restock = async (id)=>{
  const p=produtos.find(x=>x.id===id); if(!p) return
  const v = prompt(`Repor estoque de "${p.nome}".\nQuantas unidades ADICIONAR?`,'10')
  if(v===null) return
  const add = parseInt(v,10); if(isNaN(add)){ toast('Número inválido','err'); return }
  const novo = Math.max(0, p.estoque+add)
  const { error } = await sb.from('produtos').update({ estoque:novo, estoque_inicial:p.estoque_inicial+(add>0?add:0) }).eq('id',id)
  if(error){ toast('Erro ao repor','err'); return }
  toast(`Estoque de ${p.nome}: ${novo}`,'ok'); loadProdutos()
}
window.__edit = (id)=> openProduct(produtos.find(x=>x.id===id))

// ---------- render: historico ----------
function renderHist(){
  $('#histTitle').textContent = periodo==='hoje' ? 'Vendas de hoje' : 'Todas as vendas'
  const l=$('#histList')
  if(!vendas.length){ l.innerHTML=`<div class="empty"><div class="e">📊</div>Nenhuma venda ${periodo==='hoje'?'hoje':'ainda'}.</div>`; return }
  l.innerHTML = vendas.map(v=>{
    const t=new Date(v.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
    return `<div class="hrow">
      <div>
        <div class="hn">${esc(v.nome_produto)} ${v.qtd>1?'×'+v.qtd:''}</div>
        <div class="ht">${t}</div>
      </div>
      <div class="hv">${BRL(v.total)}</div>
      <button class="undo" onclick="window.__undo('${v.id}')">desfazer</button>
    </div>`
  }).join('')
}
window.__undo = async (id)=>{
  if(!confirm('Desfazer esta venda? O estoque volta e o valor sai do total.')) return
  const { error } = await sb.rpc('desfazer_venda',{ p_venda_id:id })
  if(error){ toast('Erro ao desfazer','err'); return }
  toast('Venda desfeita','ok'); loadProdutos(); loadVendas()
}

// ---------- modal produto ----------
window.openProduct = (p=null)=>{
  $('#sheetTitle').textContent = p?'Editar produto':'Novo produto'
  $('#pid').value = p?p.id:''
  $('#f_nome').value = p?p.nome:''
  $('#f_preco').value = p?String(p.preco).replace('.',','):''
  $('#f_estoque').value = p?p.estoque:''
  $('#estoqueLbl').textContent = p?'Estoque atual (ajustar)':'Quantidade em estoque'
  $('#delBtn').style.display = p?'block':'none'
  $('#scrim').classList.add('on')
  setTimeout(()=>$('#f_nome').focus(),100)
}
window.closeSheet = ()=> $('#scrim').classList.remove('on')
window.saveProduct = async ()=>{
  const id=$('#pid').value
  const nome=$('#f_nome').value.trim()
  const preco=parseFloat($('#f_preco').value.replace(/\./g,'').replace(',','.'))||0
  const estoque=parseInt($('#f_estoque').value,10)||0
  if(!nome){ toast('Digite o nome','err'); return }
  let error
  if(id){
    ;({ error } = await sb.from('produtos').update({ nome, preco, estoque }).eq('id',id))
  } else {
    ;({ error } = await sb.from('produtos').insert({ nome, preco, estoque, estoque_inicial:estoque, ordem:produtos.length }))
  }
  if(error){ toast('Erro ao salvar','err'); console.error(error); return }
  toast('Produto salvo','ok'); closeSheet(); loadProdutos()
}
window.deleteProduct = async ()=>{
  const id=$('#pid').value; if(!id) return
  if(!confirm('Excluir este produto? As vendas já feitas continuam no histórico.')) return
  const { error } = await sb.from('produtos').update({ ativo:false }).eq('id',id)
  if(error){ toast('Erro ao excluir','err'); return }
  toast('Produto excluído','ok'); closeSheet(); loadProdutos()
}

// ---------- tabs ----------
window.__tab = (name)=>{
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'))
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name))
  $('#v-'+(name==='hist'?'hist':name)).classList.add('on')
}
document.querySelectorAll('nav.tabs button').forEach(b=> b.onclick=()=>window.__tab(b.dataset.tab))

// periodo
document.querySelectorAll('.period button').forEach(b=> b.onclick=()=>{
  periodo=b.dataset.per
  document.querySelectorAll('.period button').forEach(x=>x.classList.toggle('on',x===b))
  loadVendas()
})

// ---------- util ----------
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

// ---------- realtime ----------
function setConn(ok){
  const c=$('#conn'); c.classList.toggle('off',!ok)
  $('#connTxt').textContent = ok?'ao vivo':'offline'
}
sb.channel('vendas-estoque')
  .on('postgres_changes',{event:'*',schema:'public',table:'produtos'},()=>loadProdutos())
  .on('postgres_changes',{event:'*',schema:'public',table:'vendas'},()=>loadVendas())
  .subscribe(st=> setConn(st==='SUBSCRIBED'))

// ---------- start ----------
loadProdutos(); loadVendas()
setInterval(()=>{ loadProdutos(); loadVendas() }, 30000) // fallback refresh
</script>
</body>
</html>
